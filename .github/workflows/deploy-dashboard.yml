name: Deploy dashboard

# Builds the research-queue dashboard from queue.md + the README scoreboard and publishes it
# to GitHub Pages. The page is a read-only view: nothing is generated back into the repo, so
# this never collides with the pure-addition rule that validate-scout-pr enforces on queue.md.

on:
  push:
    branches: [master]
    paths:
      - queue.md
      - README.md
      - dashboard/**
      - .github/workflows/deploy-dashboard.yml
  # Daily safety net, after the scout's scheduled run: a scout PR that auto-merges does not
  # always produce a push event that starts this workflow.
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dashboard
        run: python3 dashboard/build.py --out _site --repo-url "${{ github.server_url }}/${{ github.repository }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
