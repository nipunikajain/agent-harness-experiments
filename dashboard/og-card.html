<!doctype html>
<!-- Source for the link-preview image (dashboard/static/og.png, 1200x630). Regenerate with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
       --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
       --screenshot=dashboard/static/og.png dashboard/og-card.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #faf8f3; color: #1c1b19; overflow: hidden; position: relative;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .text { position: absolute; left: 76px; top: 0; bottom: 0; width: 580px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font-size: 19px; font-weight: 650; letter-spacing: 0.1em; text-transform: uppercase; color: oklch(50% 0.14 290); }
  h1 {
    font: 700 104px/0.98 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    letter-spacing: -0.025em; margin: 22px 0 28px;
  }
  p { font-size: 28px; line-height: 1.38; color: #4a4741; }
  .pile { position: absolute; right: 84px; top: 68px; width: 380px; height: 470px; }
  .sheet {
    position: absolute; inset: 0; border-radius: 16px; background: #fff; border: 2px solid #cfc8b8;
  }
  .sheet.s3 { transform: translate(36px, 36px); border-color: #e3ded2; }
  .sheet.s2 { transform: translate(18px, 18px); }
  .sheet.s1 { border-top: 8px solid oklch(50% 0.14 290); padding: 30px 30px 0; }
  .row { padding: 16px 0; border-bottom: 2px solid #e3ded2; }
  .row:last-child { border-bottom: 0; }
  .tag { display: inline-block; font-size: 15px; font-weight: 650; padding: 5px 12px; border-radius: 999px; }
  .bar { height: 14px; border-radius: 7px; background: #1c1b19; margin-top: 14px; }
  .bar.thin { height: 10px; background: #cfc8b8; margin-top: 10px; }
</style>
</head>
<body>
  <div class="text">
    <div class="eyebrow">Agent harnesses · MCP · Context · Serving</div>
    <h1>Research Queue</h1>
    <p>Research on AI agents and LLM infrastructure, scouted daily. Claims stay untested until they earn a verdict.</p>
  </div>
  <div class="pile" aria-hidden="true">
    <div class="sheet s3"></div>
    <div class="sheet s2"></div>
    <div class="sheet s1">
      <div class="row" style="padding-top:0">
        <span class="tag" style="background:oklch(95% 0.035 290);color:oklch(50% 0.14 290)">Harness design</span>
        <div class="bar" style="width:92%"></div><div class="bar thin" style="width:64%"></div>
      </div>
      <div class="row">
        <span class="tag" style="background:oklch(95% 0.035 155);color:oklch(50% 0.14 155)">Context management</span>
        <div class="bar" style="width:78%"></div><div class="bar thin" style="width:86%"></div>
      </div>
      <div class="row">
        <span class="tag" style="background:oklch(95% 0.035 245);color:oklch(50% 0.14 245)">MCP &amp; tool use</span>
        <div class="bar" style="width:88%"></div><div class="bar thin" style="width:52%"></div>
      </div>
      <div class="row">
        <span class="tag" style="background:oklch(95% 0.035 20);color:oklch(50% 0.14 20)">Security &amp; safety</span>
        <div class="bar" style="width:70%"></div><div class="bar thin" style="width:74%"></div>
      </div>
    </div>
  </div>
</body>
</html>
